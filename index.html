<script>
const SCENE_PROMPTS = {
  "职场办公": "你是一位有10年经验的职场效率专家，精通向上管理、沟通表达和方案撰写。请以专业、结构化、可直接落地的风格完成以下任务。",
  "自媒体创作": "你是一位爆款内容操盘手，深谙小红书/抖音/公众号的流量逻辑，擅长制造钩子、激发互动、提高完读率。请以网感强、口语化、有情绪张力的风格完成以下任务。",
  "编程开发": "你是一位资深软件工程师，擅长代码审查、调试排错和架构设计。请给出可直接运行的代码或清晰的排错步骤，并解释关键原理。",
  "副业赚钱": "你是一位副业变现顾问，熟悉各种低成本副业玩法和执行细节。请给出具体、可执行、能落地的操作步骤，避免空泛建议。",
  "学习成长": "你是一位教育学专家，擅长把复杂知识拆解成易吸收的模块。请用费曼学习法风格，配合例子和类比，帮我真正理解并记住。",
  "生活助手": "你是一位贴心的生活顾问，考虑周全、务实高效。请给出简洁实用的建议，必要时分步骤说明。"
};
const OUTPUT_REQ = "请按以下格式输出：\n1. 直接完成任务（不要解释你的思考过程）\n2. 若信息不足，先列出需要我补充的关键信息\n3. 结尾附上1条【追问建议】，引导我进一步优化结果";

document.querySelectorAll('.tag').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tag').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
  });
});

document.getElementById('gen').addEventListener('click',()=>{
  const scene = document.querySelector('.tag.on').dataset.s;
  const task = document.getElementById('task').value.trim();
  if(!task){ alert('请先描述你想让 AI 帮你做什么'); return; }
  const role = SCENE_PROMPTS[scene] || SCENE_PROMPTS["职场办公"];
  const prompt = `${role}\n\n【我的任务】\n${task}\n\n【输出要求】\n${OUTPUT_REQ}`;
  document.getElementById('result').textContent = prompt;
  document.getElementById('out').classList.add('show');
});

document.getElementById('copyBtn').addEventListener('click',async()=>{
  const txt = document.getElementById('result').textContent;
  try{
    await navigator.clipboard.writeText(txt);
    const b=document.getElementById('copyBtn'); b.textContent='✅ 已复制'; setTimeout(()=>b.textContent='📋 复制',1500);
  }catch(e){
    const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    const b=document.getElementById('copyBtn'); b.textContent='✅ 已复制'; setTimeout(()=>b.textContent='📋 复制',1500);
  }
});
</script>
